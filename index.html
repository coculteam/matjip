<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬맛집 찾기</title>
<style>
  :root{--g:#1F5B45;--y:#F2B630;--bg:#FBF8F3;--line:#E5DED2;--muted:#7A6F5F;--red:#D9534F}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:#2B2B2B;word-break:keep-all;overflow-wrap:break-word}
  header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0;flex:1}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
  main{max-width:900px;margin:0 auto;padding:14px}
  .search{display:flex;gap:8px}
  .search input{flex:1;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:16px;font-weight:600}
  .btn:disabled{opacity:.5}
  .opts{display:flex;flex-wrap:wrap;gap:12px;margin:10px 2px;font-size:14px;color:var(--muted)}
  #status{font-size:14px;color:var(--muted);margin:8px 2px;min-height:20px}
  #map{width:100%;height:320px;border-radius:12px;border:1px solid var(--line);margin:8px 0 14px;display:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .top{display:flex;align-items:center;gap:10px}
  .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .name{font-weight:700;font-size:17px;flex:1}
  .tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#EFE9DD;color:#5A5040;white-space:nowrap}
  .meta{font-size:14px;color:#444;margin:8px 0 4px;line-height:1.6}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
  .hi{background:#E3F1EA;border-color:#B9DCC8}.mid{background:#FFF6DD;border-color:#F0DFA6}.lo{background:#F8E6E5;border-color:#E9C2C0}
  .rev{font-size:13px;color:#555;border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
  .rev small{color:var(--muted)}
  a{color:var(--g)}
  .excluded{font-size:13px;color:var(--muted);margin-top:16px}
  .excluded summary{cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
  .modal input{width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:8px 0}
  .row{display:flex;gap:8px;justify-content:flex-end}
  .ghost{background:#eee;color:#333}
  #copyBtn{display:none;margin:4px 0 12px;padding:10px 14px}
</style>
</head>
<body>
<header>
  <h1>🍚 로컬맛집 찾기</h1>
  <button id="keyBtn">API 키</button>
</header>
<main>
  <form class="search" id="form">
    <input id="region" placeholder="지역명 (예: 공주 산성시장, 부여읍)" autocomplete="off">
    <button class="btn" id="go">찾기</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="optBakery"> 베이커리 포함</label>
    <label><input type="checkbox" id="optLoose"> 기준 완화 (3.8↑·50개↑)</label>
  </div>
  <div id="status"></div>
  <div id="map"></div>
  <button class="btn" id="copyBtn">📋 후보 목록 복사 (Claude 검증용)</button>
  <div id="list"></div>
  <details class="excluded" id="exWrap" style="display:none"><summary>기준에서 빠진 곳 보기</summary><div id="exList"></div></details>
</main>

<div class="modal" id="modal">
  <div class="box">
    <b>구글 지도 API 키</b>
    <p style="font-size:13px;color:#666;margin:6px 0">키는 이 기기 브라우저에만 저장되고, 페이지 코드에는 들어가지 않아요.</p>
    <input id="keyInput" placeholder="AIza로 시작하는 키">
    <div class="row">
      <button class="btn ghost" id="keyCancel" style="padding:10px 14px">닫기</button>
      <button class="btn" id="keySave" style="padding:10px 14px">저장</button>
    </div>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const QUERIES = ["한식 맛집","국밥 찌개 백반","칼국수 국수 냉면","중식 짬뽕 중국집"];
const BAKERY_QUERY = "빵집 베이커리";
const CHAINS = ["김밥천국","백종원","새마을식당","홍콩반점","한신포차","본죽","놀부","교촌","bhc","BBQ","맘스터치","이삭","파리바게뜨","뚜레쥬르","스타벅스","이디야","투썸","명륜진사","고향옥","큰맘할매","은희네","양평해장국","신전","엽기떡볶이","두찜","역전우동","청기와감자탕","이바돔","참이맛","일산칼국수","유가네닭갈비","원할머니","채선당","샤브올데이","빽다방","메가커피","컴포즈","육쌈냉면","하남돼지","봉추찜닭","미소야","얌샘","땅스부대찌개","놀부부대찌개","순대실록","병천순대","교동짬뽕","홍콩반점0410","이비가짬뽕","보배반점","짬뽕지존","신의주찹쌀순대","한촌설렁탕","신선설농탕","본가","하이디라오"];
const LOCAL_WORDS = ["동네","단골","자주","주민","살면서","사는데","집 근처","집근처","근처 살","오래","몇 년","몇년","항상","늘 ","매번","재방문","또 왔","점심","직장","회사","퇴근","출근","배달","포장","어르신","할머니","할아버지","현지","토박이","부모님","아버지","어머니"];
const TOURIST_WORDS = ["여행","관광","숙소","들렀","코스","구경","방문했는데","처음 와","유명해서","방송","티비","TV","인스타","후기 보고","블로그 보고","검색해서","지나가다"];
const EXCLUDE_TYPES = ["cafe","coffee_shop","bar","pub","night_club","wine_bar","dessert_shop","ice_cream_shop","tea_house","juice_shop"];
const BAKERY_TYPES = ["bakery"];

/* ===== 키 저장 ===== */
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const $ = id => document.getElementById(id);
function openKey(){ $("keyInput").value = LS.get("gmapsKey")||""; $("modal").style.display="flex"; }
$("keyBtn").onclick = openKey;
$("keyCancel").onclick = ()=> $("modal").style.display="none";
$("keySave").onclick = ()=>{ const v=$("keyInput").value.trim(); if(!v) return; LS.set("gmapsKey",v); $("modal").style.display="none"; location.reload(); };

/* ===== 구글 지도 불러오기 ===== */
let mapsReady = null;
function loadMaps(){
  if(mapsReady) return mapsReady;
  const key = LS.get("gmapsKey");
  if(!key){ openKey(); return Promise.reject(new Error("API 키를 먼저 저장해 주세요.")); }
  mapsReady = new Promise((res,rej)=>{
    window.__mapsCb = ()=>res();
    window.gm_authFailure = ()=>{ setStatus("❌ API 키 인증 실패: 키, 사이트 제한(github.io 주소), 결제 설정을 확인해 주세요."); };
    const s=document.createElement("script");
    s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&v=weekly&language=ko&region=KR&loading=async&callback=__mapsCb";
    s.onerror=()=>rej(new Error("구글 지도 스크립트를 불러오지 못했어요."));
    document.head.appendChild(s);
  });
  return mapsReady;
}

function setStatus(t){ $("status").textContent=t; }

/* ===== 분석 함수 ===== */
function isChain(name){
  const n=name.replace(/\s/g,"");
  if(CHAINS.some(c=>n.includes(c.replace(/\s/g,"")))) return true;
  if(/(본점|직영점)$/.test(n)) return true;
  if(/\s\S{1,8}점$/.test(name.trim())) return true;   // "가게명 ○○점" 형태
  return false;
}
function category(p){
  const t=(p.types||[]).join(" "), n=p.displayName||"";
  if(/bakery/.test(t)||/빵|베이커리|제과/.test(n)) return "베이커리";
  if(/chinese/.test(t)||/반점|짬뽕|짜장|중화|중국/.test(n)) return "중식";
  if(/noodle|ramen/.test(t)||/칼국수|국수|냉면|막국수|우동|소바|면옥|국시/.test(n)) return "면";
  return "한식";
}
function analyzeReviews(revs){
  let local=0, tour=0, oldest=null, foreign=0;
  for(const r of revs||[]){
    const txt=(r.originalText||r.text||"")+"";
    LOCAL_WORDS.forEach(w=>{ if(txt.includes(w)) local++; });
    TOURIST_WORDS.forEach(w=>{ if(txt.includes(w)) tour++; });
    const lang=r.originalTextLanguageCode||r.textLanguageCode||"";
    if(lang && !lang.startsWith("ko")) foreign++;
    const d=r.publishTime instanceof Date ? r.publishTime : (r.publishTime? new Date(r.publishTime):null);
    if(d && !isNaN(d) && (!oldest||d<oldest)) oldest=d;
  }
  tour += foreign;
  const diff=local-tour;
  const level = diff>=2 ? "높음" : diff<=-1 ? "낮음" : "보통";
  const years = oldest ? (Date.now()-oldest.getTime())/(365.25*864e5) : null;
  return {local,tour,level,oldest,years};
}
function score(p,a){
  let s = (p.rating-4)*30 + Math.log10(Math.max(p.userRatingCount,1))*10;
  s += a.level==="높음"?15 : a.level==="낮음"?-12 : 0;
  if(a.years!=null && a.years>=5) s+=8;
  return s;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtDate(d){return d? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`:"-";}

/* ===== 검색 ===== */
let map, markers=[];
async function run(region){
  $("go").disabled=true; $("list").innerHTML=""; $("exList").innerHTML=""; $("exWrap").style.display="none"; $("copyBtn").style.display="none";
  try{
    setStatus("구글 지도 불러오는 중…");
    await loadMaps();
    const {Place} = await google.maps.importLibrary("places");
    const {Map} = await google.maps.importLibrary("maps");
    const {AdvancedMarkerElement, PinElement} = await google.maps.importLibrary("marker");
    const fields=["id","displayName","formattedAddress","location","rating","userRatingCount","types","businessStatus","reviews","googleMapsURI","nationalPhoneNumber"];
    const qs=[...QUERIES]; if($("optBakery").checked) qs.push(BAKERY_QUERY);
    const all=new Map();
    for(let i=0;i<qs.length;i++){
      setStatus(`검색 중… (${i+1}/${qs.length}) ${region} ${qs[i]}`);
      const {places}=await Place.searchByText({textQuery:`${region} ${qs[i]}`,fields,language:"ko",region:"kr",maxResultCount:20});
      (places||[]).forEach(p=>{ if(!all.has(p.id)) all.set(p.id,p); });
    }
    const loose=$("optLoose").checked, minR=loose?3.8:4.0, minC=loose?50:100;
    const pass=[], out=[];
    for(const p of all.values()){
      const name=p.displayName||"", types=p.types||[];
      let why="";
      if(p.businessStatus && p.businessStatus!=="OPERATIONAL") why="영업 종료/휴업";
      else if(!types.includes("restaurant") && !types.some(t=>/_restaurant$/.test(t)) && !(($("optBakery").checked) && types.some(t=>BAKERY_TYPES.includes(t)))) why="식당 아님";
      else if(types.some(t=>EXCLUDE_TYPES.includes(t)) && !types.includes("restaurant")) why="카페·주점";
      else if(!$("optBakery").checked && types.some(t=>BAKERY_TYPES.includes(t))) why="베이커리";
      else if((p.rating||0)<minR) why=`평점 ${p.rating??"-"}`;
      else if((p.userRatingCount||0)<minC) why=`리뷰 ${p.userRatingCount||0}개`;
      else if(isChain(name)) why="프랜차이즈 추정";
      if(why){ out.push({p,why}); continue; }
      const a=analyzeReviews(p.reviews);
      pass.push({p,a,cat:category(p),s:score(p,a)});
    }
    pass.sort((x,y)=>y.s-x.s);
    // 종류 섞기: 면·중식이 있으면 상위 10곳에 최소 1곳씩
    const pick=[]; const need=["면","중식"];
    need.forEach(c=>{ const f=pass.find(x=>x.cat===c); if(f) pick.push(f); });
    for(const x of pass){ if(pick.length>=10) break; if(!pick.includes(x)) pick.push(x); }
    pick.sort((x,y)=>y.s-x.s);

    render(pick, out, region, {Map,AdvancedMarkerElement,PinElement});
    setStatus(pick.length? `후보 ${all.size}곳 중 기준 통과 ${pass.length}곳 → 추천 ${pick.length}곳 (구글 기준, ${new Date().toLocaleDateString("ko-KR")} 조회)` : `기준을 통과한 곳이 없어요. 후보 ${all.size}곳 (아래 '빠진 곳' 참고)`);
  }catch(e){ setStatus("❌ "+(e.message||e)); }
  finally{ $("go").disabled=false; }
}

function render(pick,out,region,lib){
  // 지도
  if(pick.length){
    $("map").style.display="block";
    if(!map) map=new lib.Map($("map"),{center:pick[0].p.location,zoom:14,mapId:"DEMO_MAP_ID",gestureHandling:"cooperative",streetViewControl:false,mapTypeControl:false});
    markers.forEach(m=>m.map=null); markers=[];
    const b=new google.maps.LatLngBounds();
    pick.forEach((x,i)=>{
      const pin=new lib.PinElement({glyph:String(i+1),background:"#D9534F",borderColor:"#fff",glyphColor:"#fff"});
      markers.push(new lib.AdvancedMarkerElement({map,position:x.p.location,content:pin.element,title:x.p.displayName}));
      b.extend(x.p.location);
    });
    map.fitBounds(b, 40);
  }
  // 목록
  $("list").innerHTML = pick.map((x,i)=>{
    const p=x.p,a=x.a;
    const lv = a.level==="높음"?"hi":a.level==="낮음"?"lo":"mid";
    const age = a.years==null ? `<span class="chip lo">오래된 리뷰 없음 · 영업기간 확인 필요</span>`
      : a.years>=5 ? `<span class="chip hi">가장 오래된 리뷰 ${fmtDate(a.oldest)} · 5년↑ 추정</span>`
      : `<span class="chip mid">가장 오래된 리뷰 ${fmtDate(a.oldest)} · 영업기간 확인 필요</span>`;
    const revs=(p.reviews||[]).filter(r=>(r.text||"").length>8).slice(0,2).map(r=>{
      const t=(r.text||"").slice(0,90)+((r.text||"").length>90?"…":"");
      const who=r.authorAttribution?.displayName||"구글 사용자";
      return `<div class="rev">${esc(t)}<br><small>— ${esc(who)}, ${esc(r.relativePublishTimeDescription||"")}</small></div>`;
    }).join("");
    return `<div class="card">
      <div class="top"><div class="no">${i+1}</div><div class="name">${esc(p.displayName)}</div><span class="tag">${x.cat}</span></div>
      <div class="meta">⭐ ${p.rating} (리뷰 ${p.userRatingCount.toLocaleString()}개)<br>📍 ${esc((p.formattedAddress||"").replace(/^대한민국\s*/,""))}${p.nationalPhoneNumber?`<br>📞 ${esc(p.nationalPhoneNumber)}`:""}</div>
      <div class="chips"><span class="chip ${lv}">현지인 후기 ${a.level}</span>${age}</div>
      ${revs}
      <a href="${p.googleMapsURI}" target="_blank" rel="noopener">구글 지도에서 보기 →</a>
    </div>`;
  }).join("");
  // 제외 목록
  if(out.length){
    $("exWrap").style.display="block";
    $("exList").innerHTML = out.sort((a,b)=>(b.p.userRatingCount||0)-(a.p.userRatingCount||0)).slice(0,40)
      .map(o=>`<div>· ${esc(o.p.displayName)} (${o.p.rating??"-"}/${o.p.userRatingCount||0}) — ${o.why}</div>`).join("");
  }
  // 복사용 텍스트
  if(pick.length){
    const txt = `지역맛집 ${region} — 앱 1차 후보 (구글, ${new Date().toLocaleDateString("ko-KR")} 조회)\n` +
      pick.map((x,i)=>`${i+1}. ${x.p.displayName} [${x.cat}] ${x.p.rating}/${x.p.userRatingCount} · 현지인 ${x.a.level} · 가장 오래된 리뷰 ${fmtDate(x.a.oldest)} · ${(x.p.formattedAddress||"").replace(/^대한민국\s*/,"")}`).join("\n") +
      `\n\n이 후보들로 5년 영업 근거와 네이버 후기를 확인해서 TOP5 블로그 글 써줘.`;
    const btn=$("copyBtn"); btn.style.display="inline-block";
    btn.onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); btn.textContent="✅ 복사했어요"; setTimeout(()=>btn.textContent="📋 후보 목록 복사 (Claude 검증용)",1800);}catch(e){ btn.textContent="복사가 막혔어요"; } };
  }
}

$("form").addEventListener("submit",e=>{ e.preventDefault(); const r=$("region").value.trim(); if(r) run(r); });
if(!LS.get("gmapsKey")) setTimeout(openKey,300);
</script>
</body>
</html>
